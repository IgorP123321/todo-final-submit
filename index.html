<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Menedżer Zadań</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        :root { --primary: #007BFF; --bg: #f4f7f6; --card: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 40px; }
        .container { width: 100%; max-width: 500px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; transition: 0.3s; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sub { background: #eee; color: #333; }
        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-del { background: #ff4d4d; color: white; width: auto; padding: 5px 10px; }
    </style>
</head>
<body>
<div class="container">
    <div id="auth-box" class="card">
        <h2 id="auth-title">Logowanie</h2>
        <input type="text" id="username" placeholder="Login">
        <input type="email" id="email-field" class="hidden" placeholder="E-mail">
        <input type="password" id="password" placeholder="Hasło">
        <button onclick="submitAuth()" class="btn-main" id="btn-text">Zaloguj</button>
        <button onclick="toggleAuth()" class="btn-sub" id="btn-toggle">Nie masz konta? Zarejestruj się</button>
    </div>

    <div id="app-box" class="hidden">
        <div class="card">
            <h3>Cześć, <span id="user-display"></span>!</h3>
            <button onclick="logout()" class="btn-sub">Wyloguj</button>
        </div>
        <div class="card">
            <h3>Dodaj zadanie</h3>
            <input type="text" id="t-title" placeholder="Tytuł">
            <input type="text" id="t-desc" placeholder="Opis">
            <button onclick="addTask()" class="btn-main">Dodaj</button>
        </div>
        <div class="card">
            <h3>Twoje zadania</h3>
            <div id="task-list"></div>
        </div>
    </div>
</div>

<script>
    const API = 'http://127.0.0.1:8000';
    let isLogin = true;

    function toggleAuth() {
        isLogin = !isLogin;
        document.getElementById('auth-title').innerText = isLogin ? 'Logowanie' : 'Rejestracja';
        document.getElementById('email-field').classList.toggle('hidden', isLogin);
        document.getElementById('btn-text').innerText = isLogin ? 'Zaloguj' : 'Zarejestruj';
        document.getElementById('btn-toggle').innerText = isLogin ? 'Nie masz konta? Zarejestruj się' : 'Masz konto? Zaloguj się';
    }

    async function submitAuth() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email-field').value;
        const password = document.getElementById('password').value;
        const mode = isLogin ? 'login' : 'register';

        const body = isLogin ? { username, password } : { username, email, password };

        try {
            const res = await fetch(`${API}/${mode}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok) {
                if (isLogin) {
                    localStorage.setItem('uid', data.user_id);
                    localStorage.setItem('uname', data.username);
                    showApp();
                } else {
                    alert("Zarejestrowano! Zaloguj się.");
                    toggleAuth();
                }
            } else { alert(data.detail); }
        } catch (e) { alert("Brak połączenia!"); }
    }

    function showApp() {
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('app-box').classList.remove('hidden');
        document.getElementById('user-display').innerText = localStorage.getItem('uname');
        loadTasks();
    }

    async function loadTasks() {
        const res = await fetch(`${API}/tasks/${localStorage.getItem('uid')}`);
        const tasks = await res.json();
        const container = document.getElementById('task-list');
        container.innerHTML = tasks.map(t => `
            <div class="task-item">
                <span><strong>${t.title}</strong> - ${t.description || ''}</span>
                <button onclick="delTask(${t.id})" class="btn-del">X</button>
            </div>
        `).join('');
    }

    async function addTask() {
        const title = document.getElementById('t-title').value;
        const description = document.getElementById('t-desc').value;
        await fetch(`${API}/tasks/${localStorage.getItem('uid')}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, description })
        });
        loadTasks();
    }

    async function delTask(id) {
        await fetch(`${API}/tasks/${id}`, { method: 'DELETE' });
        loadTasks();
    }

    function logout() { localStorage.clear(); location.reload(); }
    if (localStorage.getItem('uid')) showApp();
</script>
</body>
</html>
